name: Playwright Web and API BDD Tests

on:
  workflow_dispatch:

  push:
    branches: [master]

  pull_request:
    branches: [master]

  # Run automatically every day at 9:15 AM London time.
  schedule:
    - cron: "15 9 * * *"
      timezone: "Europe/London"

jobs:
  web-bdd-tests:
    name: Web BDD Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CI: true
      HEADLESS: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run web BDD tests
        run: npm run test:bdd:login

      - name: Upload web Cucumber report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: web-cucumber-report
          path: reports/
          retention-days: 30

  api-bdd-tests:
    name: ReqRes API BDD Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Secrets are unavailable to pull requests opened from forks.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository

    env:
      CI: true
      REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Verify ReqRes API secret exists
        shell: bash
        run: |
          if [ -z "$REQRES_API_KEY" ]; then
            echo "::error::Repository secret REQRES_API_KEY is not configured"
            exit 1
          fi

      - name: Run ReqRes API BDD tests
        run: npm run test:bdd:api

      - name: Upload API Cucumber report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: api-cucumber-report
          path: reports/
          retention-days: 30
