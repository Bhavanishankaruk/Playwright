name: Scheduled Playwright BDD Tests

on:
  # Run manually from the GitHub Actions page
  workflow_dispatch:

  # Run automatically every day at 9:15 AM London time
  schedule:
    - cron: "15 9 * * *"
      timezone: "Europe/London"

jobs:
  scheduled-tests:
    name: Cucumber Login E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CI: true
      HEADLESS: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Cucumber BDD tests
        run: npm run test:bdd

      - name: Upload Cucumber report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: scheduled-cucumber-report
          path: reports/
          retention-days: 30
